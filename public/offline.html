<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Top Shot Verifier — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; text-align: center; }
    .icon { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #fb923c, #dc2626); display: flex; align-items: center; justify-content: center; font-size: 36px; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    p { color: #a1a1aa; font-size: 0.875rem; max-width: 320px; line-height: 1.6; }
    a { margin-top: 0.5rem; display: inline-block; padding: 0.5rem 1.5rem; border-radius: 999px; background: linear-gradient(90deg, #f97316, #f59e0b); color: #000; font-size: 0.8rem; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="icon">🔥</div>
  <h1>You're offline</h1>
  <p>Connect to the internet to verify your collection and check challenges.</p>
  <a href="/dashboard">Try again</a>
</body>
</html>
